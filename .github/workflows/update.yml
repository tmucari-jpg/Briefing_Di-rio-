name: Briefing Diário — Atualizar notícias
on:
  push:
    paths:
      - 'scripts/update_news.py'
      - '.github/workflows/update.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'
    - cron: '30 5 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install feedparser
      - name: Actualizar briefing
        env:
          TZ: Africa/Maputo
        run: python scripts/update_news.py
      - name: Commit notícias
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/news.json
          if git diff --cached --quiet; then
            echo 'Sem alterações nas notícias.'
          else
            git commit -m 'chore: atualizar briefing diário'
            git push
          fi