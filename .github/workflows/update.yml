name: Briefing Diário — Atualizar notícias

on:
  push:
    paths:
      - 'scripts/update_news.py'
      - 'scripts/editorial_quality.py'
      - '.github/workflows/update.yml'
  workflow_dispatch:
  schedule:
    # 07:00, 11:00, 15:00, 19:00 e 23:00 em Africa/Maputo (UTC+2)
    - cron: '0 5 * * *'
    - cron: '0 9 * * *'
    - cron: '0 13 * * *'
    - cron: '0 17 * * *'
    - cron: '0 21 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Instalar dependências
        run: pip install feedparser
      - name: Actualizar briefing
        env:
          TZ: Africa/Maputo
        run: python scripts/update_news.py
      - name: Curadoria e qualidade editorial
        run: python scripts/editorial_quality.py
      - name: Validar briefing final
        run: |
          python - <<'PY'
          import json
          for f in ('docs/news-pt.json','docs/news-en.json'):
              d=json.load(open(f,encoding='utf-8'))
              n=len(d.get('items',[]))
              c=d.get('section_counts',{})
              assert n >= 8, f'{f}: menos de 8 notícias'
              assert c.get('Mundo',0) >= 4, f'{f}: Mundo insuficiente'
              assert c.get('África',0) >= 2, f'{f}: África insuficiente'
              assert c.get('Moçambique',0) >= 2, f'{f}: Moçambique insuficiente'
              assert len({x.get('title','').strip().lower() for x in d['items']}) == n, f'{f}: títulos duplicados'
              for x in d['items']:
                  for k in ('title','summary','why','impact','source','link','published','editorial_score','source_tier'):
                      assert x.get(k), f'{f}: campo ausente {k}'
                  assert x['source_tier'] in ('A','B','C')
              print(f'{f}: {n} notícias · {c}')
          PY
      - name: Commit notícias
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/news.json docs/news-pt.json docs/news-en.json
          if git diff --cached --quiet; then
            echo 'Sem alterações nas notícias.'
          else
            git commit -m 'chore: actualizar briefing editorial'
            git push
          fi

# Atualização automática cinco vezes por dia, com execução manual disponível.
